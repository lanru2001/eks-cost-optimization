---

apiVersion: batch/v1
kind: CronJob
metadata:
  name: scale-down-weekends
  namespace: kube-system  
spec:
  schedule: "0 * * * 6,0"         # Every hour, Sat (6) and Sun (0)
  timeZone: "America/New_York"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: deployment-scaler
          restartPolicy: OnFailure
          containers:
            - name: kubectl
              image: bitnami/kubectl:latest
              command:
                - /bin/sh
                - -c
                - |
                  echo "After-hours scale-down: $(date)"

                  NAMESPACES=$(kubectl get namespaces \
                    --field-selector='metadata.name!=kube-system,metadata.name!=kube-public,metadata.name!=kube-node-lease' \
                    -o jsonpath='{.items[*].metadata.name}')

                  if [ -z "$NAMESPACES" ]; then
                    echo "No namespaces found. Exiting."
                    exit 1
                  fi

                  for ns in $NAMESPACES; do
                    echo "Processing namespace: $ns"

                    DEPLOYMENTS=$(kubectl get deployments -n "$ns" \
                      -o jsonpath='{.items[*].metadata.name}')

                    if [ -z "$DEPLOYMENTS" ]; then
                      echo "  No deployments found in $ns, skipping."
                      continue
                    fi

                    for deploy in $DEPLOYMENTS; do
                      echo "  Scaling $deploy in $ns to 0"
                      kubectl scale deployment/"$deploy" -n "$ns" --replicas=0
                    done
                  done

                  echo "Scale-down complete."
